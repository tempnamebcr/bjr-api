# Full stack: API (Laravel), Horizon, Redis and the Nuxt frontend.
# Expects bjr-front cloned next to this repo:
#   ./bjr-api   (this file)
#   ./bjr-front
# Run from this folder: docker compose up --build
name: beijerref

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - beijerref

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5173:5173"
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_started
    volumes:
      - .:/var/www
      - bjr-api-vendor:/var/www/vendor
      - bjr-api-node_modules:/var/www/node_modules
    networks:
      - beijerref

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_started
    volumes:
      - .:/var/www
      - bjr-api-vendor:/var/www/vendor
      - bjr-api-node_modules:/var/www/node_modules
    command: php artisan horizon
    networks:
      - beijerref

  frontend:
    build:
      context: ../bjr-front
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Server-side only: the browser talks to Nuxt, Nuxt talks to Laravel over the compose network.
      NUXT_BACKEND_URL: http://api:8000
      NUXT_USE_MOCK: "false"
    depends_on:
      - api
    volumes:
      - ../bjr-front:/app
      - bjr-front-node_modules:/app/node_modules
    networks:
      - beijerref

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_started
    volumes:
      - .:/var/www
      - bjr-api-vendor:/var/www/vendor
      - bjr-api-node_modules:/var/www/node_modules
    command: php artisan queue:work
    profiles:
      - worker
    networks:
      - beijerref

volumes:
  redis_data:
  bjr-api-vendor:
  bjr-api-node_modules:
  bjr-front-node_modules:

networks:
  beijerref:
    driver: bridge
